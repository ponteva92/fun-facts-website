<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Fun Facts</title>
<style>
  :root { --bg:#0b1411; --card:#13211c; --accent:#2ee59d; --text:#eef7f2; --muted:#9bb5aa; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:radial-gradient(circle at 30% 20%,#123326,var(--bg) 60%); color:var(--text); padding:24px; }
  h1 { font-size:clamp(2rem,5vw,3.2rem); margin:0 0 8px; }
  h1 span { color:var(--accent); }
  p.sub { color:var(--muted); margin:0 0 32px; }
  .card { background:var(--card); border:1px solid #23483a; border-radius:20px; padding:36px 32px; max-width:620px; width:100%;
          box-shadow:0 20px 60px rgba(0,0,0,.4); text-align:center; }
  .emoji { font-size:3.5rem; }
  .fact { font-size:1.35rem; line-height:1.5; margin:16px 0 28px; min-height:4.5em; transition:opacity .25s; }
  button { background:var(--accent); color:#06130d; border:0; border-radius:999px; padding:14px 30px; font-size:1.05rem; font-weight:700; cursor:pointer; }
  button:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .count { color:var(--muted); font-size:.9rem; margin-top:18px; }
  footer { margin-top:28px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
  <h1>Random <span>Fun Facts</span></h1>
  <p class="sub">Click the button and learn something new.</p>
  <div class="card">
    <div class="emoji" id="emoji">🤓</div>
    <div class="fact" id="fact">Press the button to get your first fact!</div>
    <button id="btn">Give me a fact</button>
    <div class="count" id="count">Facts seen: 0</div>
  </div>
  <footer>Made by Heikki Niemimäki · Oulu, Finland</footer>
<script>
const facts = [
  ["🇫🇮","Finland has about 188,000 lakes, which is why it is called the land of a thousand lakes."],
  ["🐙","An octopus has three hearts and blue blood."],
  ["🍯","Honey never spoils. Edible honey has been found in ancient Egyptian tombs."],
  ["🌙","The Moon is slowly moving away from Earth, about 3.8 cm every year."],
  ["🧖","There are roughly 3 million saunas in Finland, more than one for every two people."],
  ["🐝","Bees can recognise human faces."],
  ["⚡","A bolt of lightning is about five times hotter than the surface of the Sun."],
  ["🦒","A giraffe's tongue can be about 50 cm long."],
  ["🍌","Bananas are berries, but strawberries are not."],
  ["🌌","There are more stars in the universe than grains of sand on all of Earth's beaches."],
  ["🐧","Penguins can drink salt water because a gland removes the salt."],
  ["💻","The first computer bug was a real moth found in a Harvard computer in 1947."],
  ["🧠","Your brain uses about 20% of your body's energy."],
  ["🌊","More than 80% of the ocean has never been mapped in detail."]
];
let last=-1, seen=0;
const f=document.getElementById('fact'), e=document.getElementById('emoji'), c=document.getElementById('count');
document.getElementById('btn').onclick=()=>{
  let i; do { i=Math.floor(Math.random()*facts.length); } while(i===last);
  last=i; f.style.opacity=0;
  setTimeout(()=>{ e.textContent=facts[i][0]; f.textContent=facts[i][1]; f.style.opacity=1; c.textContent='Facts seen: '+(++seen); },200);
};
</script>
</body>
</html>
